<form class="mt-8" (submit)="onSubmit($event)" role="search" aria-label="Buscar canciones en Spotify">
  <div
    class="flex flex-col gap-2 rounded-2xl border border-white/10 bg-slate-900/60 p-2 shadow-lg shadow-slate-950/30 transition focus-within:border-violet-400/50 focus-within:ring-2 focus-within:ring-violet-400/20 sm:flex-row sm:items-center"
  >
    <div class="relative flex-1">
      <label for="song-search" class="sr-only">Buscar canciones en Spotify</label>

      <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
        <svg
          class="h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
      </span>

      <input
        id="song-search"
        type="search"
        name="song-search"
        [value]="query()"
        (input)="onInput($event)"
        [attr.aria-busy]="loading()"
        placeholder="Busca una canción o artista…"
        autocomplete="off"
        enterkeyhint="search"
        class="h-12 w-full rounded-xl bg-transparent pl-10 pr-10 text-sm text-white placeholder:text-slate-500 focus:outline-none sm:text-base"
      />

      @if (query().length > 0) {
        <button
          type="button"
          (click)="clear()"
          aria-label="Limpiar búsqueda"
          title="Limpiar búsqueda"
          class="absolute inset-y-0 right-2 my-auto flex h-8 w-8 items-center justify-center rounded-lg text-slate-500 transition hover:bg-white/5 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400"
        >
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      }
    </div>

    <button
      type="submit"
      [disabled]="!canSearch()"
      class="inline-flex h-12 items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-violet-500 to-indigo-600 px-5 text-sm font-semibold text-white shadow-lg shadow-violet-900/40 transition hover:from-violet-400 hover:to-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-300 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:from-violet-500 disabled:hover:to-indigo-600"
    >
      @if (loading()) {
        <svg
          class="h-4 w-4 animate-spin"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
      } @else {
        <svg
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
      }

      <span>{{ loading() ? 'Buscando…' : 'Buscar' }}</span>
    </button>
  </div>

  <p class="mt-2 text-xs text-slate-500">
    Los resultados provienen de Spotify. Solo se buscan canciones.
  </p>

  <div class="mt-4 flex flex-wrap items-center gap-2">
    <span class="text-xs text-slate-500">Prueba con:</span>

    @for (term of suggestions; track term) {
      <button
        type="button"
        (click)="onSuggestion(term)"
        [disabled]="loading()"
        class="rounded-full border border-white/10 px-3 py-1 text-xs text-slate-300 transition hover:border-violet-400/40 hover:bg-white/5 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ term }}
      </button>
    }
  </div>
</form>
