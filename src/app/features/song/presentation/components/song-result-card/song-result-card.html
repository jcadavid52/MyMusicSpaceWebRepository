<article
  class="group flex h-full items-center gap-4 rounded-2xl border border-white/5 bg-slate-900/40 p-4 transition duration-200 hover:-translate-y-0.5 hover:border-violet-400/30 hover:bg-slate-900/70"
>
  <div
    class="h-20 w-20 shrink-0 overflow-hidden rounded-xl border border-white/5 bg-slate-800"
  >
    @if (song().album.imageUrl; as imageUrl) {
      <img
        [src]="imageUrl"
        [alt]="'Portada de ' + song().album.name"
        class="h-full w-full object-cover"
        loading="lazy"
      />
    } @else {
      <span class="flex h-full w-full items-center justify-center text-slate-600">
        <svg
          class="h-7 w-7"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
        </svg>
      </span>
    }
  </div>

  <div class="min-w-0 flex-1">
    <h3 class="truncate text-sm font-semibold text-white sm:text-base" [title]="song().name">
      {{ song().name }}
    </h3>

    <p
      class="mt-1 truncate text-sm text-slate-400"
      [title]="song().artists.join(', ')"
    >
      {{ song().artists.join(' · ') }}
    </p>

    <p class="mt-1 truncate text-xs text-slate-500">
      {{ song().album.name }}
      <span aria-hidden="true">·</span>
      {{ song().durationMs | appDuration }}
    </p>
  </div>

  <a
    [href]="song().spotifyUrl"
    target="_blank"
    rel="noopener noreferrer"
    [attr.aria-label]="'Abrir ' + song().name + ' en Spotify'"
    title="Abrir en Spotify"
    class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-white/10 text-slate-400 transition hover:border-violet-400/40 hover:bg-white/5 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400"
  >
    <svg
      class="h-4 w-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M14 3h7v7" />
      <path d="M10 14 21 3" />
      <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
    </svg>
  </a>
</article>
