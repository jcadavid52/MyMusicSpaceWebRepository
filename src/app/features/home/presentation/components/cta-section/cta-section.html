<section class="mx-auto w-full max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
  <div
    class="relative overflow-hidden rounded-3xl border border-white/10 bg-gradient-to-br from-violet-600/20 via-slate-900/60 to-indigo-600/20 px-6 py-14 text-center sm:px-12 sm:py-16">
    <div class="pointer-events-none absolute inset-x-0 -top-24 mx-auto h-48 w-48 rounded-full bg-violet-500/30 blur-3xl"
      aria-hidden="true"></div>
    <h2 class="relative text-3xl font-semibold tracking-tight text-white sm:text-4xl">
      {{ title() }}
    </h2>
    <p class="relative mx-auto mt-4 max-w-xl text-base leading-relaxed text-slate-300">
      {{ description() }}
    </p>

    <button type="button" (click)="ctaClick.emit()"
      class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-violet-500 to-indigo-600 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-violet-900/40 transition hover:from-violet-400 hover:to-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-300 sm:w-auto mt-6">
      {{ ctaLabel() }}
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </button>
  </div>
</section>
