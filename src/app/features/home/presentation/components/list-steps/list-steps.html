<section id="como-funciona" class="mx-auto w-full max-w-7xl scroll-mt-24 px-4 py-16 sm:px-6 lg:px-8">
    <div class="max-w-2xl">
        <h2 class="text-sm font-semibold uppercase tracking-widest text-violet-400">Cómo funciona</h2>
        <p class="mt-3 text-3xl font-semibold tracking-tight text-white sm:text-4xl">
            Tres pasos para empezar
        </p>
    </div>
    <ol class="mt-12 grid gap-5 md:grid-cols-3">
        @for(step of steps(); track step.title) {
        <app-step-card [stepModel]="step" />
        }
    </ol>
</section>
