<section id="funciones" class="mx-auto w-full max-w-7xl scroll-mt-24 px-4 py-16 sm:px-6 lg:px-8">
    <div class="max-w-2xl">
        <h2 class="text-sm font-semibold uppercase tracking-widest text-violet-400">Funciones</h2>
        <p class="mt-3 text-3xl font-semibold tracking-tight text-white sm:text-4xl">
            Todo lo que necesitas para documentar tu música
        </p>
        <p class="mt-4 text-base leading-relaxed text-slate-400">
            Cada función está diseñada para cubrir una etapa distinta del trabajo musical, desde el alta
            de una canción hasta su interpretación.
        </p>
    </div>

    <div class="mt-12 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
        @for(functionModel of functionsModel(); track functionModel.title) {
        <app-function-card [functionModel]="functionModel" />
        }
    </div>

</section>
