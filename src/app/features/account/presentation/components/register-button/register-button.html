<button
  type="button"
  aria-label="Registrarse"
  title="Registrarse"
  [disabled]="loading()"
  (click)="onRegister()"
  class="inline-flex items-center gap-2 rounded-lg bg-gradient-to-br from-violet-500 to-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-lg shadow-violet-900/40 transition-colors hover:from-violet-400 hover:to-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400 disabled:cursor-not-allowed disabled:opacity-70 sm:px-4"
>
  @if (loading()) {
    <svg
      class="h-4 w-4 animate-spin"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M21 12a9 9 0 1 1-6.219-8.56" />
    </svg>
  } @else {
    <svg
      class="h-4 w-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
      <circle cx="9" cy="7" r="4" />
      <path d="M19 8v6" />
      <path d="M22 11h-6" />
    </svg>
  }

  <span class="hidden sm:inline">{{ loading() ? 'Redirigiendo…' : 'Registrarse' }}</span>
</button>

@if (errorMessage(); as message) {
  <div
    role="alert"
    class="fixed right-4 top-20 z-50 flex max-w-sm items-start gap-3 rounded-xl border border-red-400/30 bg-slate-900/95 p-4 text-sm text-red-100 shadow-xl shadow-black/40 backdrop-blur"
  >
    <p class="flex-1">{{ message }}</p>
    <button
      type="button"
      aria-label="Cerrar mensaje"
      title="Cerrar mensaje"
      class="-mr-1 -mt-1 rounded-md p-1 text-red-200/80 transition-colors hover:bg-white/10 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-300"
      (click)="dismissError()"
    >
      <svg
        class="h-4 w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>
}
